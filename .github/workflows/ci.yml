# CI — chạy toàn bộ gate chất lượng trên mọi push/PR
# Enterprise gates: typecheck → lint → unit tests → production build
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests (app + server logic)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Server syntax check
        run: |
          node --check server/index.js
          node --check server/games.js
